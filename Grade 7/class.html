
<!DOCTYPE html>
<html>
<head>
    <title>CSS Class and ID</title>

    <style>
        .heading {
            color: blue;
            text-align: center;
        }

        .text {
            color: green;
            font-size: 18px;
        }

        #special {
            color: red;
            background-color: yellow;
        }
    </style>
</head>
<body>

    <h1 class="heading">Welcome to CSS</h1>

    <p class="text">CSS makes websites beautiful.</p>

    <p class="text">We can use the same class for many elements.</p>

    <p id="special">This is a special paragraph using ID.</p>

</body>
</html>
