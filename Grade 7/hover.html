<!DOCTYPE html>
<html>
<head>
    <title>Button Hover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="hover-btn">Hover Me</button>

</body>
</html>


button {
    background-color: blue;
    color: white;
    padding: 12px 25px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: orange;
    transform: scale(1.1);
}
