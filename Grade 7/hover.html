
<!DOCTYPE html>
<html>
<head>
    <title>CSS Hover Effect</title>

    <style>
        button {
            background-color: purple;
            color: white;
            padding: 12px 25px;
            border: 2px solid purple;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.5s;
        }

        button:hover {
            background-color: white;
            color: purple;
            border: 2px solid purple;
        }
    </style>
</head>
<body>

    <h2>Learn CSS Hover</h2>

    <button>Explore More</button>

</body>
</html>
